
<!DOCTYPE html>
<html>
<head>
    <title>Task 1 - Penguin Analysis</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        svg {
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>

<h2>1. Average Body Mass by Species</h2>
<svg id="chart1" width="700" height="350"></svg>

<h2>2. Average Flipper Length by Species</h2>
<svg id="chart2" width="700" height="350"></svg>

<h2>3. Average Body Mass by Island</h2>
<svg id="chart3" width="700" height="350"></svg>

<script>
d3.csv("penguins.csv", d3.autoType).then(data => {

    // GRAPH 1: Body Mass by Species

    const data1 = data.filter(d => d.species != null && d.body_mass_g != null);

    const summary1 = Array.from(
        d3.rollup(data1, v => d3.mean(v, d => d.body_mass_g), d => d.species),
        ([name, value]) => ({name, value})
    );

    const svg1 = d3.select("#chart1");
    const margin1 = {top: 30, right: 30, bottom: 60, left: 80};
    const w1 = 700 - margin1.left - margin1.right;
    const h1 = 350 - margin1.top - margin1.bottom;

    const chart1 = svg1.append("g")
        .attr("transform", `translate(${margin1.left},${margin1.top})`);

    const x1 = d3.scaleBand()
        .domain(summary1.map(d => d.name))
        .range([0, w1])
        .padding(0.3);

    const y1 = d3.scaleLinear()
        .domain([0, d3.max(summary1, d => d.value)])
        .nice()
        .range([h1, 0]);

    chart1.append("g")
        .attr("transform", `translate(0,${h1})`)
        .call(d3.axisBottom(x1));

    chart1.append("g").call(d3.axisLeft(y1));

    chart1.selectAll("rect")
        .data(summary1)
        .join("rect")
        .attr("x", d => x1(d.name))
        .attr("y", d => y1(d.value))
        .attr("width", x1.bandwidth())
        .attr("height", d => h1 - y1(d.value))
        .attr("fill", d => d.name === "Gentoo" ? "red" : "steelblue");

    chart1.selectAll(".label")
        .data(summary1)
        .join("text")
        .attr("class", "label")
        .attr("x", d => x1(d.name) + x1.bandwidth() / 2)
        .attr("y", d => y1(d.value) - 5)
        .attr("text-anchor", "middle")
        .text(d => Math.round(d.value));

    chart1.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -h1 / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Average Body Mass (g)");


    // GRAPH 2: Flipper Length by Species

    const data2 = data.filter(d => d.species != null && d.flipper_length_mm != null);

    const summary2 = Array.from(
        d3.rollup(data2, v => d3.mean(v, d => d.flipper_length_mm), d => d.species),
        ([name, value]) => ({name, value})
    );

    const svg2 = d3.select("#chart2");
    const margin2 = {top: 30, right: 30, bottom: 60, left: 80};
    const w2 = 700 - margin2.left - margin2.right;
    const h2 = 350 - margin2.top - margin2.bottom;

    const chart2 = svg2.append("g")
        .attr("transform", `translate(${margin2.left},${margin2.top})`);

    const x2 = d3.scaleBand()
        .domain(summary2.map(d => d.name))
        .range([0, w2])
        .padding(0.3);

    const y2 = d3.scaleLinear()
        .domain([0, d3.max(summary2, d => d.value)])
        .nice()
        .range([h2, 0]);

    chart2.append("g")
        .attr("transform", `translate(0,${h2})`)
        .call(d3.axisBottom(x2));

    chart2.append("g").call(d3.axisLeft(y2));

    chart2.selectAll("rect")
        .data(summary2)
        .join("rect")
        .attr("x", d => x2(d.name))
        .attr("y", d => y2(d.value))
        .attr("width", x2.bandwidth())
        .attr("height", d => h2 - y2(d.value))
        .attr("fill", d => d.name === "Gentoo" ? "red" : "steelblue");

    chart2.selectAll(".label")
        .data(summary2)
        .join("text")
        .attr("class", "label")
        .attr("x", d => x2(d.name) + x2.bandwidth() / 2)
        .attr("y", d => y2(d.value) - 5)
        .attr("text-anchor", "middle")
        .text(d => Math.round(d.value));

    chart2.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -h2 / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Average Flipper Length (mm)");


    // GRAPH 3: Body Mass by Island

    const data3 = data.filter(d => d.island != null && d.body_mass_g != null);

    const summary3 = Array.from(
        d3.rollup(data3, v => d3.mean(v, d => d.body_mass_g), d => d.island),
        ([name, value]) => ({name, value})
    );

    const svg3 = d3.select("#chart3");
    const margin3 = {top: 30, right: 30, bottom: 60, left: 80};
    const w3 = 700 - margin3.left - margin3.right;
    const h3 = 350 - margin3.top - margin3.bottom;

    const chart3 = svg3.append("g")
        .attr("transform", `translate(${margin3.left},${margin3.top})`);

    const x3 = d3.scaleBand()
        .domain(summary3.map(d => d.name))
        .range([0, w3])
        .padding(0.3);

    const y3 = d3.scaleLinear()
        .domain([0, d3.max(summary3, d => d.value)])
        .nice()
        .range([h3, 0]);

    chart3.append("g")
        .attr("transform", `translate(0,${h3})`)
        .call(d3.axisBottom(x3));

    chart3.append("g").call(d3.axisLeft(y3));

    chart3.selectAll("rect")
        .data(summary3)
        .join("rect")
        .attr("x", d => x3(d.name))
        .attr("y", d => y3(d.value))
        .attr("width", x3.bandwidth())
        .attr("height", d => h3 - y3(d.value))
        .attr("fill", d => d.name === "Biscoe" ? "red" : "steelblue");

    chart3.selectAll(".label")
        .data(summary3)
        .join("text")
        .attr("class", "label")
        .attr("x", d => x3(d.name) + x3.bandwidth() / 2)
        .attr("y", d => y3(d.value) - 5)
        .attr("text-anchor", "middle")
        .text(d => Math.round(d.value));

    chart3.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -h3 / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Average Body Mass (g)");

}).catch(error => console.error(error));
</script>

</body>
</html>
