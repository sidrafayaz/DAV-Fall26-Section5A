
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two Penguin Charts</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}
svg {
    display: block;
    margin: 20px auto;
}
</style>
</head>
<body>

<h2>Average Body Mass by Species</h2>
<svg id="chart1" width="700" height="400"></svg>

<h2>Number of Penguins per Island</h2>
<svg id="chart2" width="700" height="400"></svg>

<script>
d3.csv("penguins.csv", d3.autoType).then(data => {

    // GRAPH 1: Average Body Mass by Species

    const data1 = data.filter(d =>
        d.species != null && d.body_mass_g != null
    );

    const speciesData = Array.from(
        d3.rollup(
            data1,
            v => d3.mean(v, d => d.body_mass_g),
            d => d.species
        ),
        ([name, value]) => ({name, value})
    );

    const svg1 = d3.select("#chart1");
    const margin1 = {top: 30, right: 30, bottom: 60, left: 80};
    const width1 = 700 - margin1.left - margin1.right;
    const height1 = 400 - margin1.top - margin1.bottom;

    const chart1 = svg1.append("g")
        .attr("transform",
            `translate(${margin1.left},${margin1.top})`);

    const x1 = d3.scaleBand()
        .domain(speciesData.map(d => d.name))
        .range([0, width1])
        .padding(0.3);

    const y1 = d3.scaleLinear()
        .domain([0, d3.max(speciesData, d => d.value)])
        .nice()
        .range([height1, 0]);

    chart1.append("g")
        .attr("transform", `translate(0,${height1})`)
        .call(d3.axisBottom(x1));

    chart1.append("g")
        .call(d3.axisLeft(y1));

    chart1.selectAll("rect")
        .data(speciesData)
        .join("rect")
        .attr("x", d => x1(d.name))
        .attr("y", d => y1(d.value))
        .attr("width", x1.bandwidth())
        .attr("height", d => height1 - y1(d.value))
        .attr("fill", "steelblue");

    chart1.selectAll(".label")
        .data(speciesData)
        .join("text")
        .attr("class", "label")
        .attr("x", d => x1(d.name) + x1.bandwidth() / 2)
        .attr("y", d => y1(d.value) - 5)
        .attr("text-anchor", "middle")
        .text(d => Math.round(d.value));

    chart1.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -height1 / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Average Body Mass (g)");


    // GRAPH 2: Number of Penguins per Island

    const data2 = data.filter(d => d.island != null);

    const islandData = Array.from(
        d3.rollup(
            data2,
            v => v.length,
            d => d.island
        ),
        ([name, value]) => ({name, value})
    );

    const svg2 = d3.select("#chart2");
    const margin2 = {top: 30, right: 30, bottom: 60, left: 80};
    const width2 = 700 - margin2.left - margin2.right;
    const height2 = 400 - margin2.top - margin2.bottom;

    const chart2 = svg2.append("g")
        .attr("transform",
            `translate(${margin2.left},${margin2.top})`);

    const x2 = d3.scaleBand()
        .domain(islandData.map(d => d.name))
        .range([0, width2])
        .padding(0.3);

    const y2 = d3.scaleLinear()
        .domain([0, d3.max(islandData, d => d.value)])
        .nice()
        .range([height2, 0]);

    chart2.append("g")
        .attr("transform", `translate(0,${height2})`)
        .call(d3.axisBottom(x2));

    chart2.append("g")
        .call(d3.axisLeft(y2));

    chart2.selectAll("rect")
        .data(islandData)
        .join("rect")
        .attr("x", d => x2(d.name))
        .attr("y", d => y2(d.value))
        .attr("width", x2.bandwidth())
        .attr("height", d => height2 - y2(d.value))
        .attr("fill", "steelblue");

    chart2.selectAll(".label")
        .data(islandData)
        .join("text")
        .attr("class", "label")
        .attr("x", d => x2(d.name) + x2.bandwidth() / 2)
        .attr("y", d => y2(d.value) - 5)
        .attr("text-anchor", "middle")
        .text(d => d.value);

    chart2.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -height2 / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("Number of Penguins");

}).catch(error => console.error(error));
</script>

</body>
</html>
