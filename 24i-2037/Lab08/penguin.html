
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Analysis - Task 1</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        .bar {
            stroke: none;
        }

        .axis text {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Penguin Analysis</h1>
    <h2 id="chart-title">Average Body Mass by Species</h2>
    <p id="chart-description">Gentoo is highlighted in red.</p>

    <svg id="chart" width="700" height="450"></svg>

    <script>
        const svg = d3.select("#chart");
        const width = 700;
        const height = 450;

        const margin = {
            top: 30,
            right: 30,
            bottom: 70,
            left: 80
        };

        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const chart = svg.append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        d3.csv("dataset/penguins.csv", d3.autoType)
            .then(data => {

                // STEP 1: Choose what to group by and what to measure.
                const groupedData = d3.rollup(
                    data.filter(d => d.body_mass_g != null),
                    v => d3.mean(v, d => d.body_mass_g),
                    d => d.species
                );

                const result = Array.from(groupedData,
                    ([name, value]) => ({
                        name: name,
                        value: value
                    })
                );

                const xScale = d3.scaleBand()
                    .domain(result.map(d => d.name))
                    .range([0, innerWidth])
                    .padding(0.3);

                const yScale = d3.scaleLinear()
                    .domain([0, d3.max(result, d => d.value) * 1.1])
                    .nice()
                    .range([innerHeight, 0]);

                // Draw the bars.
                chart.selectAll("rect")
                    .data(result)
                    .join("rect")
                    .attr("class", "bar")
                    .attr("x", d => xScale(d.name))
                    .attr("y", d => yScale(d.value))
                    .attr("width", xScale.bandwidth())
                    .attr("height",
                        d => innerHeight - yScale(d.value))
                    .attr("fill",
                        d => d.name === "Gentoo"
                            ? "red"
                            : "steelblue");

                // Add the X-axis.
                chart.append("g")
                    .attr("transform",
                        `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(xScale));

                // Add the Y-axis.
                chart.append("g")
                    .call(d3.axisLeft(yScale));

                // Add axis labels.
                chart.append("text")
                    .attr("x", innerWidth / 2)
                    .attr("y", innerHeight + 50)
                    .attr("text-anchor", "middle")
                    .text("Penguin Species");

                chart.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -innerHeight / 2)
                    .attr("y", -55)
                    .attr("text-anchor", "middle")
                    .text("Average Body Mass (g)");

            })
            .catch(error => {
                console.error("Error loading data:", error);
            });
    </script>

</body>
</html>
