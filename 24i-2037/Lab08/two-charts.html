
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Analysis - Two Charts</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        svg {
            display: block;
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
        }

        .bar {
            stroke: none;
        }

        .axis text {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Penguin Analysis - Two Charts</h1>

    <h2>Chart 1: Average Body Mass by Species</h2>
    <svg id="chart1" width="700" height="400"></svg>

    <h2>Chart 2: Number of Penguins by Island</h2>
    <svg id="chart2" width="700" height="400"></svg>

    <!-- SCRIPT 1: Average body mass by species -->
    <script>
    {
        const svg = d3.select("#chart1");
        const width = 700;
        const height = 400;

        const margin = {
            top: 20,
            right: 30,
            bottom: 60,
            left: 80
        };

        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const chart = svg.append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        d3.csv("dataset/penguins.csv", d3.autoType)
            .then(data => {

                const groupedData = d3.rollup(
                    data.filter(d => d.body_mass_g != null),
                    v => d3.mean(v, d => d.body_mass_g),
                    d => d.species
                );

                const result = Array.from(groupedData,
                    ([name, value]) => ({
                        name: name,
                        value: value
                    })
                );

                const xScale = d3.scaleBand()
                    .domain(result.map(d => d.name))
                    .range([0, innerWidth])
                    .padding(0.3);

                const yScale = d3.scaleLinear()
                    .domain([0, d3.max(result, d => d.value) * 1.1])
                    .nice()
                    .range([innerHeight, 0]);

                chart.selectAll("rect")
                    .data(result)
                    .join("rect")
                    .attr("class", "bar")
                    .attr("x", d => xScale(d.name))
                    .attr("y", d => yScale(d.value))
                    .attr("width", xScale.bandwidth())
                    .attr("height",
                        d => innerHeight - yScale(d.value))
                    .attr("fill",
                        d => d.name === "Gentoo"
                            ? "red"
                            : "steelblue");

                chart.append("g")
                    .attr("transform",
                        `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(xScale));

                chart.append("g")
                    .call(d3.axisLeft(yScale));

                chart.append("text")
                    .attr("x", innerWidth / 2)
                    .attr("y", innerHeight + 45)
                    .attr("text-anchor", "middle")
                    .text("Penguin Species");

                chart.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -innerHeight / 2)
                    .attr("y", -55)
                    .attr("text-anchor", "middle")
                    .text("Average Body Mass (g)");

            })
            .catch(error => console.error(error));
    }
    </script>

    <!-- SCRIPT 2: Number of penguins by island -->
    <script>
    {
        const svg = d3.select("#chart2");
        const width = 700;
        const height = 400;

        const margin = {
            top: 20,
            right: 30,
            bottom: 60,
            left: 80
        };

        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const chart = svg.append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        d3.csv("dataset/penguins.csv", d3.autoType)
            .then(data => {

                const groupedData = d3.rollup(
                    data,
                    v => v.length,
                    d => d.island
                );

                const result = Array.from(groupedData,
                    ([name, value]) => ({
                        name: name,
                        value: value
                    })
                );

                const xScale = d3.scaleBand()
                    .domain(result.map(d => d.name))
                    .range([0, innerWidth])
                    .padding(0.3);

                const yScale = d3.scaleLinear()
                    .domain([0, d3.max(result, d => d.value) * 1.1])
                    .nice()
                    .range([innerHeight, 0]);

                chart.selectAll("rect")
                    .data(result)
                    .join("rect")
                    .attr("class", "bar")
                    .attr("x", d => xScale(d.name))
                    .attr("y", d => yScale(d.value))
                    .attr("width", xScale.bandwidth())
                    .attr("height",
                        d => innerHeight - yScale(d.value))
                    .attr("fill", "steelblue");

                chart.append("g")
                    .attr("transform",
                        `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(xScale));

                chart.append("g")
                    .call(d3.axisLeft(yScale));

                chart.append("text")
                    .attr("x", innerWidth / 2)
                    .attr("y", innerHeight + 45)
                    .attr("text-anchor", "middle")
                    .text("Island");

                chart.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -innerHeight / 2)
                    .attr("y", -55)
                    .attr("text-anchor", "middle")
                    .text("Number of Penguins");

            })
            .catch(error => console.error(error));
    }
    </script>

</body>
</html>
