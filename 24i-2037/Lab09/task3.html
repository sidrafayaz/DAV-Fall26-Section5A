<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 3: Flight Route Network</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f8f9fa; }
    h2 { color: #2c3e50; margin-bottom: 5px; }
    p.subtitle { color: #7f8c8d; margin-top: 0; font-size: 0.95rem; }
    #chart { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: inline-block; }
    .link { stroke: #94a3b8; stroke-opacity: 0.6; transition: stroke-opacity 0.2s, stroke 0.2s; }
    .node circle { stroke: #ffffff; stroke-width: 2px; cursor: pointer; transition: opacity 0.2s; }
    .node text { font-size: 11px; font-weight: 600; fill: #1e293b; pointer-events: none; }
    .dimmed { opacity: 0.15 !important; }
    .highlighted { stroke: #e11d48 !important; stroke-opacity: 1 !important; }
  </style>
</head>
<body>

  <h2>Task 3: Pakistan Flight Route Network Diagram</h2>
  <p class="subtitle">Force-directed network: Node size = Route Degree, Link width = Weekly Flights</p>

  <div id="chart"></div>

  <script>
    const embeddedFlights = [
      {source: "Karachi", target: "Lahore", flights: 70},
      {source: "Karachi", target: "Islamabad", flights: 65},
      {source: "Karachi", target: "Peshawar", flights: 28},
      {source: "Karachi", target: "Quetta", flights: 25},
      {source: "Karachi", target: "Multan", flights: 21},
      {source: "Karachi", target: "Faisalabad", flights: 14},
      {source: "Karachi", target: "Gwadar", flights: 10},
      {source: "Lahore", target: "Islamabad", flights: 20},
      {source: "Lahore", target: "Quetta", flights: 7},
      {source: "Islamabad", target: "Quetta", flights: 10},
      {source: "Islamabad", target: "Skardu", flights: 14},
      {source: "Islamabad", target: "Sialkot", flights: 6}
    ];

    d3.csv("flights.csv", d3.autoType).then(data => render(data)).catch(() => render(embeddedFlights));

    function render(linksData) {
      const width = 800, height = 550;

      // Extract unique nodes and degree counts
      const nodeMap = new Map();
      linksData.forEach(d => {
        nodeMap.set(d.source, (nodeMap.get(d.source) || 0) + 1);
        nodeMap.set(d.target, (nodeMap.get(d.target) || 0) + 1);
      });

      const nodes = Array.from(nodeMap, ([id, degree]) => ({ id, degree }));
      const links = linksData.map(d => ({ source: d.source, target: d.target, flights: d.flights }));

      const linkScale = d3.scaleLinear()
        .domain(d3.extent(links, d => d.flights))
        .range([1.5, 8]);

      const nodeRadiusScale = d3.scaleSqrt()
        .domain(d3.extent(nodes, d => d.degree))
        .range([8, 22]);

      const svg = d3.select("#chart").append("svg")
        .attr("width", width)
        .attr("height", height);

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(110))
        .force("charge", d3.forceManyBody().strength(-350))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collide", d3.forceCollide().radius(d => nodeRadiusScale(d.degree) + 15));

      const link = svg.append("g")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke-width", d => linkScale(d.flights));

      const node = svg.append("g")
        .selectAll(".node")
        .data(nodes)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      node.append("circle")
        .attr("r", d => nodeRadiusScale(d.degree))
        .attr("fill", d => d.degree >= 4 ? "#f97316" : "#0284c7");

      node.append("text")
        .attr("dx", d => nodeRadiusScale(d.degree) + 6)
        .attr("dy", "0.35em")
        .text(d => d.id);

      // Interactive Hover Highlight
      node.on("mouseover", (event, d) => {
        const connectedCityNames = new Set();
        connectedCityNames.add(d.id);

        link.classed("highlighted", l => {
          if (l.source.id === d.id || l.target.id === d.id) {
            connectedCityNames.add(l.source.id);
            connectedCityNames.add(l.target.id);
            return true;
          }
          return false;
        }).classed("dimmed", l => !(l.source.id === d.id || l.target.id === d.id));

        node.classed("dimmed", n => !connectedCityNames.has(n.id));
      }).on("mouseout", () => {
        link.classed("highlighted", false).classed("dimmed", false);
        node.classed("dimmed", false);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
    }
  </script>
</body>
</html>
