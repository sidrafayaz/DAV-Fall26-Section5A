
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Structure Dendrogram</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f7fa;
        }

        h1 {
            text-align: center;
            color: #263238;
        }

        #chart {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        .link {
            fill: none;
            stroke: #999;
            stroke-width: 1.5px;
        }

        .node circle {
            fill: #1976d2;
            stroke: #0d47a1;
            stroke-width: 1.5px;
        }

        .node text {
            font-size: 12px;
            fill: #222;
        }
    </style>
</head>

<body>

    <h1>University Structure Dendrogram</h1>

    <div id="chart"></div>

    <script>
        const data = {
            name: "University",
            children: [
                {
                    name: "Computer Science",
                    children: [
                        { name: "Data Structures" },
                        { name: "Databases" },
                        { name: "Data Visualization" },
                        { name: "AI" }
                    ]
                },
                {
                    name: "Engineering",
                    children: [
                        { name: "Circuits" },
                        { name: "Thermodynamics" },
                        { name: "Mechanics" }
                    ]
                },
                {
                    name: "Business",
                    children: [
                        { name: "Marketing" },
                        { name: "Accounting" },
                        { name: "Finance" }
                    ]
                },
                {
                    name: "Sciences",
                    children: [
                        { name: "Physics" },
                        { name: "Chemistry" },
                        { name: "Statistics" }
                    ]
                }
            ]
        };

        const width = 1100;
        const height = 600;
        const margin = { top: 40, right: 180, bottom: 30, left: 100 };

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const root = d3.hierarchy(data);

        const treeLayout = d3.tree()
            .size([
                height - margin.top - margin.bottom,
                width - margin.left - margin.right
            ]);

        treeLayout(root);

        const group = svg.append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        group.selectAll(".link")
            .data(root.links())
            .enter()
            .append("path")
            .attr("class", "link")
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x));

        const nodes = group.selectAll(".node")
            .data(root.descendants())
            .enter()
            .append("g")
            .attr("class", "node")
            .attr("transform",
                d => `translate(${d.y},${d.x})`);

        nodes.append("circle")
            .attr("r", 6);

        nodes.append("text")
            .attr("dy", "0.35em")
            .attr("x", d => d.children ? -10 : 10)
            .attr("text-anchor",
                d => d.children ? "end" : "start")
            .text(d => d.data.name);

    </script>

</body>
</html>
